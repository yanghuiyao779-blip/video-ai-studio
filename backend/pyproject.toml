[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "video-ai-studio-backend"
version = "2.0.0"
description = "Production-ready video URL to transcript, subtitle and AI summary pipeline"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0.36,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "celery[redis]>=5.6,<6",
  "redis>=5,<7",
  "yt-dlp[default]>=2026.1.1",
  "faster-whisper>=1.2.1,<2",
  "httpx>=0.28,<1",
  "opencc-python-reimplemented>=0.1.7,<0.2",
  "cryptography>=50,<51",
  "PyJWT>=2.10,<3",
  "argon2-cffi>=23.1,<26",
  "python-multipart>=0.0.20,<1",
  "python-docx>=1.1,<2",
  "pgvector>=0.3,<1",
  "playwright>=1.52,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
