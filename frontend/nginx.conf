server {
    listen 80;
    server_name _;
    client_max_body_size 8g;

    # Docker service IPs may change when the backend container is recreated.
    # Resolve the service name at request time instead of retaining Nginx's
    # startup-time address and returning 502 for the old container IP.
    resolver 127.0.0.11 ipv6=off valid=10s;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        set $backend_upstream backend;
        # $request_uri keeps the /api/ prefix expected by FastAPI while the
        # variable makes the Docker service name resolve dynamically.
        proxy_pass http://$backend_upstream:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri /index.html;
    }
}
